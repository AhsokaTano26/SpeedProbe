# Include this server block from nginx.conf's http {} context.
# Set DNS, certificate paths and upstream address for your deployment.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name speed.example.com;
    ssl_certificate /etc/letsencrypt/live/speed.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/speed.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # The upstream enforces a streamed per-request byte cap. Keep the proxy's
    # body limit disabled to support unknown-length chunked uploads.
    client_max_body_size 0;
    client_body_timeout 75s;
    gzip off;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Accept-Encoding "identity";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_max_temp_file_size 0;
        proxy_intercept_errors off;
        proxy_next_upstream off;
        proxy_connect_timeout 5s;
        proxy_send_timeout 75s;
        proxy_read_timeout 75s;

        # The upstream sends no-store, no-transform and X-Accel-Buffering: no.
        # Do not configure proxy_ignore_headers X-Accel-Buffering here.
    }
}
