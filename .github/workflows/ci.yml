name: CI
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Commit to validate
        type: string
        default: ''
      skip_packages:
        description: Release workflow builds its own versioned packages
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ inputs.skip_packages && github.run_id || github.ref }}
  cancel-in-progress: ${{ !inputs.skip_packages }}

defaults:
  run:
    shell: bash

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            go: '1.23.x'
          - os: ubuntu-latest
            go: '1.26.x'
          - os: macos-latest
            go: '1.26.x'
          - os: windows-latest
            go: '1.26.x'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: go.mod
      - run: test -z "$(gofmt -l cmd internal)"
      - run: go vet ./...
      - run: go test -race ./...
      - run: CGO_ENABLED=0 go build -trimpath -o speedprobe ./cmd/speedprobe

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - run: docker build -t speedprobe:ci .
      - run: docker run --rm speedprobe:ci version

  packages:
    if: ${{ !inputs.skip_packages }}
    needs: [test, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          cache-dependency-path: go.mod
      - name: Verify release packaging
        run: python3 scripts/test_release.py
      - name: Build development packages
        env:
          PACKAGE_VERSION: v0.0.0-ci.${{ github.run_number }}
        run: bash scripts/package-release.sh "$PACKAGE_VERSION" dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: speedprobe-ci-${{ github.run_number }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
