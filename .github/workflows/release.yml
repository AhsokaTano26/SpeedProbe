name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release, e.g. v0.1.0 or v0.1.0-rc.1
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      commit: ${{ steps.tag.outputs.commit }}
      tag_object: ${{ steps.tag.outputs.tag_object }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate and resolve existing tag
        id: tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          bash scripts/package-release.sh --validate-version "$RELEASE_TAG"
          commit=$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")
          tag_object=$(git rev-parse --verify "refs/tags/$RELEASE_TAG")
          printf 'tag=%s\ncommit=%s\ntag_object=%s\n' "$RELEASE_TAG" "$commit" "$tag_object" >> "$GITHUB_OUTPUT"
          if [[ "$RELEASE_TAG" == *-* ]]; then
            printf 'prerelease=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'prerelease=false\n' >> "$GITHUB_OUTPUT"
          fi

  checks:
    needs: resolve
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.resolve.outputs.commit }}
      skip_packages: true

  build:
    needs: [resolve, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tag: ${{ needs.resolve.outputs.tag }}
      prerelease: ${{ needs.resolve.outputs.prerelease }}
      tag_object: ${{ needs.resolve.outputs.tag_object }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          cache-dependency-path: go.mod
      - name: Build versioned release packages
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          python3 scripts/test_release.py
          bash scripts/package-release.sh "$RELEASE_TAG" dist
          (cd dist && sha256sum --check checksums.txt)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-packages
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-packages
          path: dist
      - name: Verify checksums
        run: (cd dist && sha256sum --check checksums.txt)
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
          EXPECTED_TAG_OBJECT: ${{ needs.build.outputs.tag_object }}
        run: |
          verify_tag() {
            local actual_tag_object
            actual_tag_object=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq .object.sha)
            if [[ "$actual_tag_object" != "$EXPECTED_TAG_OBJECT" ]]; then
              printf 'Tag changed during the release; refusing to publish mismatched packages.\n' >&2
              return 1
            fi
          }
          verify_tag
          release_args=("--prerelease=$PRERELEASE")
          if [[ "$PRERELEASE" == 'true' ]]; then
            release_args+=(--latest=false)
          fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft > "$RUNNER_TEMP/release.json"; then
            if [[ "$(jq -r .isDraft "$RUNNER_TEMP/release.json")" != 'true' ]]; then
              printf 'Release %s is already published; leaving existing assets intact.\n' "$RELEASE_TAG"
              exit 0
            fi
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --verify-tag --draft --generate-notes --title "SpeedProbe $RELEASE_TAG" "${release_args[@]}"
          fi
          # Recover an interrupted draft upload, then publish only when every
          # archive and the verified checksum file have been uploaded.
          gh release upload "$RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          verify_tag
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false "${release_args[@]}"
